<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>OBS Web Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

  #v {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
  }

  /* 90°/270°: swap CSS dimensions so the landscape video fills a portrait screen */
  #v.r90 {
    top: 50%; left: 50%;
    width: 100vh; height: 100vw;
    transform: translate(-50%, -50%) rotate(90deg);
  }
  #v.r180 { transform: rotate(180deg); }
  #v.r270 {
    top: 50%; left: 50%;
    width: 100vh; height: 100vw;
    transform: translate(-50%, -50%) rotate(270deg);
  }

  #status {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,.7);
    color: #fff;
    padding: 8px 18px;
    border-radius: 20px;
    font: 14px/1.4 sans-serif;
    pointer-events: none;
    text-align: center;
    transition: opacity .5s;
    max-width: 80vw;
    z-index: 20;
  }
  #status.hidden { opacity: 0; }

  .ctrl {
    position: fixed;
    width: 104px; height: 104px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,.55);
    color: #fff;
    font-size: 48px;
    line-height: 104px;
    text-align: center;
    cursor: pointer;
    z-index: 30;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .ctrl:active { background: rgba(255,255,255,.25); }
  #rotbtn  { bottom: 20px; right: 20px; }
  #fsbtn   { bottom: 20px; right: 140px; }
  #backbtn { bottom: 20px; left: 20px; font-size: 36px; }
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<div id="status">Connecting…</div>
<button id="backbtn" class="ctrl" title="Back">⬅</button>
<button id="fsbtn"   class="ctrl" title="Fullscreen">⛶</button>
<button id="rotbtn"  class="ctrl" title="Rotate">⟳</button>

<script>
(async function() {
  const video  = document.getElementById('v');
  const status = document.getElementById('status');
  const rotbtn = document.getElementById('rotbtn');
  const fsbtn  = document.getElementById('fsbtn');
  const backbtn= document.getElementById('backbtn');

  backbtn.addEventListener('click', () => { location.href = '/'; });

  const rotClasses = ['', 'r90', 'r180', 'r270'];
  let rotIdx = 0;
  rotbtn.addEventListener('click', () => {
    if (rotClasses[rotIdx]) video.classList.remove(rotClasses[rotIdx]);
    rotIdx = (rotIdx + 1) % 4;
    if (rotClasses[rotIdx]) video.classList.add(rotClasses[rotIdx]);
  });

  fsbtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
      fsbtn.textContent = '✕';
    } else {
      document.exitFullscreen();
      fsbtn.textContent = '⛶';
    }
  });
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement)
      fsbtn.textContent = '⛶';
  });

  function setStatus(msg, autohide) {
    status.textContent = msg;
    status.classList.remove('hidden');
    if (autohide) setTimeout(() => status.classList.add('hidden'), 3000);
  }

  const streamIdx = (parseInt(location.pathname.slice(1)) || 1) - 1;
  const offerPath = '/offer/' + streamIdx;

  async function connect() {
    setStatus('Connecting…');

    const pc = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });

    let alive = true;
    function cleanup(delayMs) {
      if (!alive) return;
      alive = false;
      pc.close();
      setTimeout(connect, delayMs);
    }

    pc.addTransceiver('video', { direction: 'recvonly' });

    pc.ontrack = (e) => {
      // Chrome fires ontrack with an empty streams array when the answer SDP
      // has no a=msid; Firefox creates a default stream.  Handle both.
      const stream = (e.streams && e.streams.length > 0)
        ? e.streams[0]
        : new MediaStream([e.track]);
      video.srcObject = stream;
      video.play().catch(() => {});
      setStatus('Live', true);

      // Small 100ms jitter buffer — Chrome is fine at 0 but Firefox stutters
      // without a buffer to absorb decode timing variance.  NACK (handled by
      // the plugin's RtcpNackResponder) recovers from actual packet loss.
      try {
        if (e.receiver) e.receiver.playoutDelayHint = 0.1;
        else pc.getReceivers().forEach(r => {
          if (r.track && r.track.kind === 'video') r.playoutDelayHint = 0.1;
        });
      } catch(_) {}
    };

    pc.onconnectionstatechange = () => {
      const s = pc.connectionState;
      if (s === 'connected') {
        setStatus('Live', true);
      } else if (s === 'disconnected') {
        setStatus('Reconnecting…');
        // Give the connection a moment to self-heal (common on flaky WiFi)
        // before tearing down and starting a fresh ICE attempt.
        setTimeout(() => {
          if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed')
            cleanup(1000);
        }, 2000);
      } else if (s === 'failed') {
        setStatus('Connection lost. Reconnecting…');
        cleanup(1000);
      }
    };

    try {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      if (pc.iceGatheringState !== 'complete') {
        await Promise.race([
          new Promise(res => {
            pc.addEventListener('icegatheringstatechange', function h() {
              if (pc.iceGatheringState === 'complete') {
                pc.removeEventListener('icegatheringstatechange', h);
                res();
              }
            });
          }),
          new Promise(res => setTimeout(res, 3000))
        ]);
      }

      const r = await fetch(offerPath, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sdp: pc.localDescription.sdp })
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();

      // Status set BEFORE setRemoteDescription so ontrack (which fires during
      // setRemoteDescription in some browsers) can override it with 'Live'.
      setStatus('Waiting for video…');

      await pc.setRemoteDescription({ type: 'answer', sdp: data.sdp });
    } catch (err) {
      setStatus('Error. Retrying…');
      cleanup(2000);
    }
  }

  connect();
})();
</script>
</body>
</html>

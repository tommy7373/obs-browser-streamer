<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>OBS Web Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

  #v {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
  }

  /* 90°/270°: swap CSS dimensions so the landscape video fills a portrait screen */
  #v.r90 {
    top: 50%; left: 50%;
    width: 100vh; height: 100vw;
    transform: translate(-50%, -50%) rotate(90deg);
  }
  #v.r180 { transform: rotate(180deg); }
  #v.r270 {
    top: 50%; left: 50%;
    width: 100vh; height: 100vw;
    transform: translate(-50%, -50%) rotate(270deg);
  }

  #status {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,.7);
    color: #fff;
    padding: 8px 18px;
    border-radius: 20px;
    font: 14px/1.4 sans-serif;
    pointer-events: none;
    text-align: center;
    transition: opacity .5s;
    max-width: 80vw;
    z-index: 20;
  }
  #status.hidden { opacity: 0; }

  .ctrl {
    position: fixed;
    width: 104px; height: 104px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,.55);
    color: #fff;
    font-size: 48px;
    line-height: 104px;
    text-align: center;
    cursor: pointer;
    z-index: 30;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .ctrl:active { background: rgba(255,255,255,.25); }
  #rotbtn  { bottom: 20px; right: 20px; }
  #fsbtn   { bottom: 20px; right: 140px; }
  #mutebtn { bottom: 20px; right: 260px; font-size: 38px; }
  #backbtn { bottom: 20px; left: 20px; font-size: 36px; }
  #statsbtn{ top: 20px; right: 20px; width: 64px; height: 64px;
             font-size: 26px; line-height: 64px; }

  /* Fade chrome away after idle. The stats panel is excluded —
     when toggled on it stays visible regardless of activity. */
  .chrome { transition: opacity .35s ease-out; }
  body.idle .chrome { opacity: 0; pointer-events: none; }

  #stats {
    position: fixed;
    top: 20px; left: 20px;
    background: rgba(0,0,0,.75);
    color: #fff;
    padding: 10px 14px;
    border-radius: 8px;
    font: 12px/1.45 ui-monospace, Consolas, monospace;
    pointer-events: none;
    z-index: 25;
    white-space: pre;
    display: none;
    min-width: 220px;
  }
  #stats.show { display: block; }
  #stats .warn { color: #ffb84d; }
  #stats .bad  { color: #ff6b6b; }
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<div id="status" class="chrome">Connecting…</div>
<div id="stats"></div>
<button id="backbtn"  class="ctrl chrome" title="Back">⬅</button>
<button id="fsbtn"    class="ctrl chrome" title="Fullscreen">⛶</button>
<button id="mutebtn"  class="ctrl chrome" title="Unmute">🔇</button>
<button id="rotbtn"   class="ctrl chrome" title="Rotate">⟳</button>
<button id="statsbtn" class="ctrl chrome" title="Stats">📊</button>

<script>
(async function() {
  const video    = document.getElementById('v');
  const status   = document.getElementById('status');
  const rotbtn   = document.getElementById('rotbtn');
  const fsbtn    = document.getElementById('fsbtn');
  const mutebtn  = document.getElementById('mutebtn');
  const backbtn  = document.getElementById('backbtn');
  const statsbtn = document.getElementById('statsbtn');
  const statsBox = document.getElementById('stats');

  // Browsers require a user gesture to unmute autoplaying media. The
  // <video> element starts muted; this button flips it once the user taps.
  function updateMuteIcon() { mutebtn.textContent = video.muted ? '🔇' : '🔊'; }
  mutebtn.addEventListener('click', () => {
    video.muted = !video.muted;
    if (!video.muted) video.play().catch(() => {});
    updateMuteIcon();
  });
  video.addEventListener('volumechange', updateMuteIcon);

  // --- Chrome auto-fade ---
  // After ~3s of no pointer / touch / key activity the controls fade out.
  // Any interaction restores them and restarts the timer.
  let idleTimer = null;
  function showChrome() {
    document.body.classList.remove('idle');
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
  }
  ['mousemove', 'mousedown', 'touchstart', 'keydown', 'wheel']
    .forEach(ev => window.addEventListener(ev, showChrome, { passive: true }));
  showChrome();

  let statsVisible = false;
  let statsTimer   = null;
  let statsPc      = null;
  let prevReport   = null;
  let prevTs       = 0;

  statsbtn.addEventListener('click', () => {
    statsVisible = !statsVisible;
    statsBox.classList.toggle('show', statsVisible);
    if (!statsVisible) statsBox.textContent = '';
  });
  // Keyboard toggle (desktop convenience)
  window.addEventListener('keydown', (e) => {
    if (e.key === 's' || e.key === 'S') statsbtn.click();
  });

  function fmt(n, d) { return (n === undefined || n === null) ? '—' : n.toFixed(d || 0); }
  function color(line, cls) { return cls ? `<span class="${cls}">${line}</span>` : line; }

  async function pollStats() {
    if (!statsPc) return;
    let report;
    try { report = await statsPc.getStats(); } catch { return; }
    const now = performance.now();
    const dt  = prevTs ? (now - prevTs) / 1000 : 0;

    let inbound = null, track = null, candPair = null, remoteInbound = null;
    report.forEach(s => {
      if (s.type === 'inbound-rtp' && s.kind === 'video') inbound = s;
      else if (s.type === 'track' && s.kind === 'video') track = s;
      else if (s.type === 'candidate-pair' && s.state === 'succeeded' && s.nominated) candPair = s;
      else if (s.type === 'remote-inbound-rtp' && s.kind === 'video') remoteInbound = s;
    });

    if (!inbound) { statsBox.textContent = 'no inbound video yet'; return; }

    const prevIn = prevReport ? prevReport.get(inbound.id) : null;
    const dBytes   = prevIn ? (inbound.bytesReceived   - prevIn.bytesReceived)   : 0;
    const dFrames  = prevIn ? (inbound.framesDecoded   - prevIn.framesDecoded)   : 0;
    const dDropped = prevIn ? ((inbound.framesDropped||0) - (prevIn.framesDropped||0)) : 0;
    const dLost    = prevIn ? (inbound.packetsLost     - prevIn.packetsLost)     : 0;
    const dRecv    = prevIn ? (inbound.packetsReceived - prevIn.packetsReceived) : 0;
    const dNack    = prevIn ? ((inbound.nackCount||0)  - (prevIn.nackCount||0))  : 0;
    const dPli     = prevIn ? ((inbound.pliCount||0)   - (prevIn.pliCount||0))   : 0;
    const dKey     = prevIn ? ((inbound.keyFramesDecoded||0) - (prevIn.keyFramesDecoded||0)) : 0;
    const dFreeze  = prevIn ? ((inbound.freezeCount||0) - (prevIn.freezeCount||0)) : 0;
    const dFreezeDur = prevIn ? ((inbound.totalFreezesDuration||0) - (prevIn.totalFreezesDuration||0)) : 0;

    const kbps = dt > 0 ? (dBytes * 8 / 1000 / dt) : 0;
    const fps  = dt > 0 ? (dFrames / dt) : 0;
    const lossPct = (dRecv + dLost) > 0 ? (dLost / (dRecv + dLost) * 100) : 0;

    const jbDelay = inbound.jitterBufferDelay;
    const jbCount = inbound.jitterBufferEmittedCount;
    const prevJbDelay = prevIn ? prevIn.jitterBufferDelay : 0;
    const prevJbCount = prevIn ? prevIn.jitterBufferEmittedCount : 0;
    const dJbDelay = jbDelay - prevJbDelay;
    const dJbCount = jbCount - prevJbCount;
    const jbMs = dJbCount > 0 ? (dJbDelay / dJbCount * 1000) : 0;

    const rtt = candPair ? candPair.currentRoundTripTime : null;
    const remoteJitter = remoteInbound ? remoteInbound.jitter : null;

    const lines = [];
    lines.push(`fps        ${fmt(fps,1)}    ${inbound.frameWidth||0}x${inbound.frameHeight||0}`);
    lines.push(color(`bitrate    ${fmt(kbps,0)} kbps`, kbps < 100 && dt > 0 ? 'warn' : ''));
    lines.push(color(`loss       ${fmt(lossPct,1)}%   (${dLost}/${dLost+dRecv})`,
                     lossPct > 2 ? 'bad' : (lossPct > 0.5 ? 'warn' : '')));
    lines.push(`jitter buf ${fmt(jbMs,0)} ms`);
    if (rtt !== null) lines.push(`rtt        ${fmt(rtt*1000,0)} ms`);
    if (remoteJitter !== null) lines.push(`net jitter ${fmt(remoteJitter*1000,1)} ms`);
    lines.push(color(`nack/pli   ${dNack}/${dPli} per s`, (dNack > 5 || dPli > 0) ? 'warn' : ''));
    lines.push(`keyframes  ${dKey} per s   (total ${inbound.keyFramesDecoded||0})`);
    lines.push(color(`freezes    ${dFreeze} (${fmt(dFreezeDur*1000,0)} ms)`,
                     dFreeze > 0 ? 'bad' : ''));
    lines.push(`dropped    ${dDropped} per s   (total ${inbound.framesDropped||0})`);
    lines.push(`assembled  ${inbound.framesAssembled||inbound.framesReceived||0}`);
    lines.push(`decoder    ${inbound.decoderImplementation||'?'}`);

    statsBox.innerHTML = lines.join('\n');

    prevReport = report;
    prevTs = now;
  }

  function startStatsPolling(pc) {
    statsPc = pc;
    prevReport = null;
    prevTs = 0;
    if (statsTimer) clearInterval(statsTimer);
    statsTimer = setInterval(pollStats, 1000);
  }
  function stopStatsPolling() {
    if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
    statsPc = null;
  }

  backbtn.addEventListener('click', () => { location.href = '/'; });

  const rotClasses = ['', 'r90', 'r180', 'r270'];
  let rotIdx = 0;
  rotbtn.addEventListener('click', () => {
    if (rotClasses[rotIdx]) video.classList.remove(rotClasses[rotIdx]);
    rotIdx = (rotIdx + 1) % 4;
    if (rotClasses[rotIdx]) video.classList.add(rotClasses[rotIdx]);
  });

  fsbtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
      fsbtn.textContent = '✕';
    } else {
      document.exitFullscreen();
      fsbtn.textContent = '⛶';
    }
  });
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement)
      fsbtn.textContent = '⛶';
  });

  function setStatus(msg, autohide) {
    status.textContent = msg;
    status.classList.remove('hidden');
    if (autohide) setTimeout(() => status.classList.add('hidden'), 3000);
  }

  const streamIdx = (parseInt(location.pathname.slice(1)) || 1) - 1;
  const offerPath = '/offer/' + streamIdx;

  async function connect() {
    setStatus('Connecting…');

    const pc = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });

    let alive = true;
    function cleanup(delayMs) {
      if (!alive) return;
      alive = false;
      stopStatsPolling();
      pc.close();
      setTimeout(connect, delayMs);
    }

    startStatsPolling(pc);

    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });

    // Collect tracks into a single MediaStream so audio + video stay synced
    // and arrive together on the <video> element regardless of which ontrack
    // event fires first.
    const remoteStream = new MediaStream();
    video.srcObject = remoteStream;

    pc.ontrack = (e) => {
      remoteStream.addTrack(e.track);
      video.play().catch(() => {});
      if (e.track.kind === 'video') setStatus('Live', true);

      // Small 100ms jitter buffer — Chrome is fine at 0 but Firefox stutters
      // without a buffer to absorb decode timing variance.  NACK (handled by
      // the plugin's RtcpNackResponder) recovers from actual packet loss.
      try {
        if (e.receiver) e.receiver.playoutDelayHint = 0.1;
        else pc.getReceivers().forEach(r => {
          if (r.track && r.track.kind === 'video') r.playoutDelayHint = 0.1;
        });
      } catch(_) {}
    };

    pc.onconnectionstatechange = () => {
      const s = pc.connectionState;
      if (s === 'connected') {
        setStatus('Live', true);
      } else if (s === 'disconnected') {
        setStatus('Reconnecting…');
        // Give the connection a moment to self-heal (common on flaky WiFi)
        // before tearing down and starting a fresh ICE attempt.
        setTimeout(() => {
          if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed')
            cleanup(1000);
        }, 2000);
      } else if (s === 'failed') {
        setStatus('Connection lost. Reconnecting…');
        cleanup(1000);
      }
    };

    try {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      if (pc.iceGatheringState !== 'complete') {
        await Promise.race([
          new Promise(res => {
            pc.addEventListener('icegatheringstatechange', function h() {
              if (pc.iceGatheringState === 'complete') {
                pc.removeEventListener('icegatheringstatechange', h);
                res();
              }
            });
          }),
          new Promise(res => setTimeout(res, 3000))
        ]);
      }

      const r = await fetch(offerPath, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sdp: pc.localDescription.sdp })
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();

      // Status set BEFORE setRemoteDescription so ontrack (which fires during
      // setRemoteDescription in some browsers) can override it with 'Live'.
      setStatus('Waiting for video…');

      await pc.setRemoteDescription({ type: 'answer', sdp: data.sdp });
    } catch (err) {
      setStatus('Error. Retrying…');
      cleanup(2000);
    }
  }

  connect();
})();
</script>
</body>
</html>
